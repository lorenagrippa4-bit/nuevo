<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RA - Arquitectura Interna del Microprocesador</title>
  <!-- Librerías A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- MARCADOR HIRO -->
    <a-marker preset="hiro">
      
      <!-- CONTENEDOR PRINCIPAL CON ROTACIÓN -->
      <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear" position="0 0.2 0">
        
        <!-- BASE DEL CHIP / SUSTRATO (Verde) -->
        <a-box position="0 0 0" width="2" height="0.08" depth="2" color="#0A5C36"></a-box>
        
        <!-- PINS / CONTACTOS DORADOS -->
        <a-box position="0 -0.02 0" width="2.05" height="0.03" depth="2.05" color="#DAA520"></a-box>

        <!-- ESTRUCTURA INTERNA / ARQUITECTURA DEL NÚCLEO (Desglosada) -->
        
        <!-- UAL / ALU: Unidad Aritmético-Lógica (Rojo) -->
        <a-box position="-0.45 0.1 0.45" width="0.75" height="0.1" depth="0.75" color="#E63946"></a-box>
        <a-text value="ALU / UAL" position="-0.45 0.2 0.45" align="center" scale="0.3 0.3 0.3" rotation="-90 0 0" color="#FFFFFF"></a-text>

        <!-- UC: Unidad de Control (Azul) -->
        <a-box position="0.45 0.1 0.45" width="0.75" height="0.1" depth="0.75" color="#1D3557"></a-box>
        <a-text value="UC (Control)" position="0.45 0.2 0.45" align="center" scale="0.3 0.3 0.3" rotation="-90 0 0" color="#FFFFFF"></a-text>

        <!-- MEMORIA CACHÉ L1/L2 (Amarillo) -->
        <a-box position="0 0.1 -0.45" width="1.65" height="0.1" depth="0.65" color="#F4A261"></a-box>
        <a-text value="MEMORIA CACHE L1/L2" position="0 0.2 -0.45" align="center" scale="0.3 0.3 0.3" rotation="-90 0 0" color="#000000"></a-text>

        <!-- REGISTROS INTERNOS (Gris Metalizado) -->
        <a-cylinder position="0 0.16 0" radius="0.2" height="0.12" color="#4A4E69"></a-cylinder>
        <a-text value="REGISTROS" position="0 0.26 0" align="center" scale="0.25 0.25 0.25" rotation="-90 0 0" color="#FFFFFF"></a-text>

        <!-- BUSES DE DATOS E INSTRUCCIONES (Líneas doradas) -->
        <a-box position="0 0.08 0.45" width="0.15" height="0.04" depth="0.75" color="#FFD700"></a-box>
        <a-box position="0 0.08 0" width="0.15" height="0.04" depth="0.9" color="#FFD700" rotation="0 90 0"></a-box>

      </a-entity>

      <!-- PISTAS CLAVE PARA RESPONDER PREGUNTAS -->
      <a-entity position="0 1.2 0">
        <!-- Pista 1 -->
        <a-text value="PISTA 1: La ALU/UAL ejecuta operaciones matematicas y logicas." 
                position="0 0.5 0" align="center" scale="0.4 0.4 0.4" color="#FF0000" bg-color="#000000"></a-text>
        
        <!-- Pista 2 -->
        <a-text value="PISTA 2: La UC dirije y coordina el flujo de instrucciones." 
                position="0 0.2 0" align="center" scale="0.4 0.4 0.4" color="#00FFFF" bg-color="#000000"></a-text>
        
        <!-- Pista 3 -->
        <a-text value="PISTA 3: La Memoria Cache almacena datos ultrarrapidos de acceso frecuente." 
                position="0 -0.1 0" align="center" scale="0.4 0.4 0.4" color="#FFFF00" bg-color="#000000"></a-text>
      </a-entity>

    </a-marker>

    <!-- CÁMARA DE AR -->
    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
